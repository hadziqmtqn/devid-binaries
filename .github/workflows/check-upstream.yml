name: Check upstream

# Weekly (Devid Phase 5 R5): compare the newest PHP 8.3/8.4/8.5, nginx stable and Caddy with the
# current release's manifest.json, and start "Build and release" when anything is newer.
# The build scripts resolve those same newest versions, and their checks gate what ships.
on:
  schedule:
    - cron: "0 1 * * 1"   # Monday 01:00 UTC = 08:00 Asia/Jakarta
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to dispatch release.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the latest release
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/upstream.py --self-test
          curl -fsSL -o manifest.json "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json"
          python3 scripts/upstream.py --compare manifest.json
      - name: Start a release build
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -R "${{ github.repository }}"
