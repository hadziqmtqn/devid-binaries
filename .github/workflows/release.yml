name: Build and release

# Manual for now (R1). A weekly upstream check comes in R5.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: YYYY.MM.DD-<run number>)"
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Libraries (OpenSSL, ICU, libpq, ...) take most of the build; reuse them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            work/downloads
            work/buildroot
            work/pkgroot
          key: php-${{ matrix.php }}-${{ hashFiles('scripts/build-php.sh', 'scripts/fetch-spc.sh') }}
          restore-keys: php-${{ matrix.php }}-
      - run: PHP_VER=${{ matrix.php }} scripts/build-php.sh
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}
          path: dist/*.tar.gz
          if-no-files-found: error

  nginx:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            work/downloads
            work/buildroot
            work/pkgroot
          key: nginx-${{ hashFiles('scripts/build-nginx.sh', 'scripts/fetch-spc.sh') }}
          restore-keys: nginx-
      - run: scripts/build-nginx.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nginx
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [php, nginx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 scripts/manifest.py --self-test
          python3 scripts/manifest.py --tag "$TAG" --dist dist --repo "${{ github.repository }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/manifest.json dist/checksums.txt \
            --title "$TAG" \
            --notes "Static PHP 8.3/8.4/8.5 and nginx for Devid (macOS x86_64). See manifest.json; verify with checksums.txt."
