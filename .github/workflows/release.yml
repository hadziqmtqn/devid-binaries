name: Build and release

# Manual, or dispatched by check-upstream.yml when PHP, nginx or Caddy has a newer release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: YYYY.MM.DD-<run number>)"
        required: false
      dry_run:
        description: "Build and check everything, but publish no release (e.g. to test a branch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        # Intel and Apple silicon runners, each building for its own arch (Devid D-044), and Ubuntu for
        # Linux x86_64 (Devid D-057). "key" is the manifest's arch key, also used for caches and
        # artifacts: the macOS ones stay as they were, so their caches carry over.
        target:
          - {os: darwin, arch: x86_64, key: x86_64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, key: arm64, runner: macos-15}
          - {os: linux, arch: x86_64, key: linux-x86_64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.target.runner }}
    # A cold cache also builds ImageMagick's format libraries for the catalog (29 min on 2 cores).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # Libraries (OpenSSL, ICU, libpq, ImageMagick, ...) take most of the build; reuse them between runs.
      - uses: actions/cache@v6
        with:
          path: |
            work/downloads
            work/buildroot
            work/pkgroot
          key: php-${{ matrix.target.key }}-${{ matrix.php }}-${{ hashFiles('scripts/build-php.sh', 'scripts/fetch-spc.sh', 'scripts/build-ext.sh', 'scripts/check-linux.sh', 'extensions/**') }}
          restore-keys: php-${{ matrix.target.key }}-${{ matrix.php }}-
      # Linux: every binary must also run on an older CPU, under QEMU (Devid Phase 12 L1); patchelf
      # drops the build root's runpath.
      - if: matrix.target.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user patchelf gdb
      - run: PHP_VER=${{ matrix.php }} scripts/build-php.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # spc download: the anonymous API limit runs out with six jobs
      # The extension catalog (Devid D-021), built against the build root of the step above.
      - run: PHP_VER=${{ matrix.php }} scripts/build-ext.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # spc fetches some library sources through the GitHub API
      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php }}-${{ matrix.target.key }}
          path: dist/*.tar.gz
          if-no-files-found: error

  nginx:
    strategy:
      fail-fast: false
      matrix:
        # As in the php job.
        target:
          - {os: darwin, arch: x86_64, key: x86_64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, key: arm64, runner: macos-15}
          - {os: linux, arch: x86_64, key: linux-x86_64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            work/downloads
            work/buildroot
            work/pkgroot
          key: nginx-${{ matrix.target.key }}-${{ hashFiles('scripts/build-nginx.sh', 'scripts/fetch-spc.sh', 'scripts/check-linux.sh') }}
          restore-keys: nginx-${{ matrix.target.key }}-
      - if: matrix.target.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user patchelf gdb
      - run: scripts/build-nginx.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # upstream.py: avoid the anonymous API rate limit
      - uses: actions/upload-artifact@v7
        with:
          name: nginx-${{ matrix.target.key }}
          path: dist/*.tar.gz
          if-no-files-found: error

  caddy:
    # Mirrors the official build (no compile), so Linux is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          # One upstream version for every build, even if Caddy releases in between.
          export CADDY_VER="$(python3 scripts/upstream.py caddy)"
          OS=darwin ARCH=x86_64 scripts/mirror-caddy.sh
          OS=darwin ARCH=arm64 scripts/mirror-caddy.sh
          OS=linux ARCH=x86_64 scripts/mirror-caddy.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: caddy
          path: dist/*.tar.gz
          if-no-files-found: error

  mailpit:
    # Mirrors the official build (no compile), like caddy (Devid D-049).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          # One upstream version for every build, even if Mailpit releases in between.
          export MAILPIT_VER="$(python3 scripts/upstream.py mailpit)"
          OS=darwin ARCH=x86_64 scripts/mirror-mailpit.sh
          OS=darwin ARCH=arm64 scripts/mirror-mailpit.sh
          OS=linux ARCH=x86_64 scripts/mirror-mailpit.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: mailpit
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [php, nginx, caddy, mailpit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # shortcut: each arch job picks the newest PHP and nginx patch itself; when upstream releases
      # during a run the two arches differ, manifest.py stops ("two versions of ...") and a rerun fixes it.
      - name: Manifest and checksums
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 scripts/manifest.py --self-test
          python3 scripts/manifest.py --tag "$TAG" --dist dist --repo "${{ github.repository }}"
      - name: Keep the manifest of a dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: dist/manifest.json
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Devid D-038: GitHub's "Latest" here is the newest devid (devid-v*). Devid reads this build's
          # manifest from the rolling runtime-latest release.
          gh release create "$TAG" dist/*.tar.gz dist/manifest.json dist/checksums.txt \
            --latest=false \
            --title "$TAG" \
            --notes "Static PHP 8.3/8.4/8.5 with its extension catalog, nginx, and mirrors of the official Caddy and Mailpit for Devid: macOS on Intel and Apple silicon (x86_64, arm64), and Linux x86_64 (glibc 2.17 and later; not used by a Devid release yet). See manifest.json; verify with checksums.txt."
          if ! gh release view runtime-latest >/dev/null 2>&1; then
            gh release create runtime-latest --latest=false --title "Devid runtime (latest)" \
              --notes "Always the newest PHP, nginx, Caddy and Mailpit builds for Devid. manifest.json points at the dated release that holds them."
          fi
          gh release upload runtime-latest dist/manifest.json --clobber
          # devid 0.10.0 and older read manifest.json from the Latest release, a devid release.
          LATEST_TAG=$(gh release view --json tagName -q .tagName)
          case "$LATEST_TAG" in devid-v*) gh release upload "$LATEST_TAG" dist/manifest.json --clobber ;; esac
