name: Build and release

# Manual, or dispatched by check-upstream.yml when PHP, nginx or Caddy has a newer release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: YYYY.MM.DD-<run number>)"
        required: false
      dry_run:
        description: "Build and check everything, but publish no release (e.g. to test a branch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    runs-on: macos-15-intel
    # A cold cache also builds ImageMagick's format libraries for the catalog (29 min on 2 cores).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # Libraries (OpenSSL, ICU, libpq, ImageMagick, ...) take most of the build; reuse them between runs.
      - uses: actions/cache@v6
        with:
          path: |
            work/downloads
            work/buildroot
            work/pkgroot
          key: php-${{ matrix.php }}-${{ hashFiles('scripts/build-php.sh', 'scripts/fetch-spc.sh', 'scripts/build-ext.sh', 'extensions/**') }}
          restore-keys: php-${{ matrix.php }}-
      - run: PHP_VER=${{ matrix.php }} scripts/build-php.sh
      # The extension catalog (Devid D-021), built against the build root of the step above.
      - run: PHP_VER=${{ matrix.php }} scripts/build-ext.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # spc fetches some library sources through the GitHub API
      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.php }}
          path: dist/*.tar.gz
          if-no-files-found: error

  nginx:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            work/downloads
            work/buildroot
            work/pkgroot
          key: nginx-${{ hashFiles('scripts/build-nginx.sh', 'scripts/fetch-spc.sh') }}
          restore-keys: nginx-
      - run: scripts/build-nginx.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # upstream.py: avoid the anonymous API rate limit
      - uses: actions/upload-artifact@v7
        with:
          name: nginx
          path: dist/*.tar.gz
          if-no-files-found: error

  caddy:
    # Mirrors the official build (no compile), so Linux is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/mirror-caddy.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: caddy
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [php, nginx, caddy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 scripts/manifest.py --self-test
          python3 scripts/manifest.py --tag "$TAG" --dist dist --repo "${{ github.repository }}"
      - name: Keep the manifest of a dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: dist/manifest.json
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicitly "Latest": Devid reads releases/latest/download/manifest.json, and devid's own
          # releases (devid-v*, devid-latest) are published here with --latest=false.
          gh release create "$TAG" dist/*.tar.gz dist/manifest.json dist/checksums.txt \
            --latest \
            --title "$TAG" \
            --notes "Static PHP 8.3/8.4/8.5 with its extension catalog, nginx and a mirror of the official Caddy for Devid (macOS x86_64). See manifest.json; verify with checksums.txt."
